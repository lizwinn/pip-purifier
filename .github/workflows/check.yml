# SPDX-License-Identifier: MIT
#
# Runs the whole suite on x86_64-linux and aarch64-linux: the flake's checks
# (the fixture builds in the Nix sandbox, the unit and negative tests, the
# offline install and the formatting), their evaluation for every system, a
# lock run against the network that has to reproduce each committed
# lockfile byte for byte, and the commands that build with Nix themselves.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Flake checks
        run: nix flake check -L
      - name: Evaluation for every system
        run: nix flake check --all-systems --no-build
      - name: Lock run reproduces the lockfiles
        run: tests/lock-run.sh
      - name: Commands that build with Nix
        run: tests/interactive.sh
